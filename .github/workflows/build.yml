name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable Long Paths
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name 'LongPathsEnabled' -Value 1

      - name: Install Ninja
        run: choco install ninja

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone Aseprite Recursive
        run: |
          git clone --recursive --depth 1 --branch v1.3.15 https://github.com/aseprite/aseprite.git aseprite

      - name: Download Skia m124
        run: |
          Invoke-WebRequest -Uri "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip" -OutFile "skia.zip"
          Expand-Archive -Path "skia.zip" -DestinationPath "skia"

      - name: CMake Configure
        run: |
          New-Item -ItemType Directory -Force -Path "aseprite\build"
          Set-Location "aseprite\build"
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$env:GITHUB_WORKSPACE\skia" `
            -DSKIA_LIBRARY_DIR="$env:GITHUB_WORKSPACE\skia\out\Release-x64" `
            -DSKIA_LIBRARY="$env:GITHUB_WORKSPACE\skia\out\Release-x64\skia.lib" `
            ..

      - name: Build Aseprite
        run: |
          Set-Location "aseprite\build"
          ninja aseprite

      - name: Prepare Artifact
        run: |
          New-Item -ItemType Directory -Force -Path "dist"
          Copy-Item -Path "aseprite\build\bin\*" -Destination "dist" -Recurse

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-v1.3.15
          path: dist
