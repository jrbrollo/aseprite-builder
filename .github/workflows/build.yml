name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Enable Long Paths
        run: git config --system core.longpaths true

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Clone Aseprite with Submodules
        run: |
          git clone --recursive --depth 1 --branch v1.3.15 https://github.com/aseprite/aseprite.git aseprite

      - name: Download Skia m102
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/aseprite/skia/releases/download/m102-861e4743af/Skia-Windows-Release-x64.zip" -OutFile "skia.zip" -UseBasicParsing
          Expand-Archive -Force "skia.zip" "skia"

      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: powershell
        run: |
          $abs_src = Join-Path $env:GITHUB_WORKSPACE "aseprite"
          $abs_skia = Join-Path $env:GITHUB_WORKSPACE "skia"
          $abs_build = Join-Path $env:GITHUB_WORKSPACE "build"
          mkdir $abs_build -Force
          Set-Location $abs_build
          cmake -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$abs_skia" `
            -DSKIA_LIBRARY_DIR="$abs_skia\out\Release-x64" `
            -DSKIA_LIBRARY="$abs_skia\out\Release-x64\skia.lib" `
            -DENABLE_UPDATER=OFF `
            -DENABLE_TESTS=OFF `
            "$abs_src"

      - name: Compile Aseprite
        run: |
          cd build
          ninja aseprite

      - name: Package Portable Zip
        shell: powershell
        run: |
          mkdir dist -Force
          Copy-Item "build\bin\aseprite.exe" -Destination "dist\" -Force
          Copy-Item "build\bin\data" -Destination "dist\data" -Recurse -Force
          Compress-Archive -Path "dist\*" -DestinationPath "Aseprite-Portable.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: Aseprite-Portable.zip
